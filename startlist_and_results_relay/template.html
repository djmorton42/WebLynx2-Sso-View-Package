<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Start List &amp; Results — Relay</title>
    <link rel="icon" type="image/png" href="/views/startlist_and_results_relay/sso-logo.png">
    <link rel="stylesheet" href="/views/shared/fonts.css">
    <link rel="stylesheet" href="/views/startlist_and_results_relay/styles.css">
  </head>
  <!-- TEMPORARY preview bg: restore class="preview-background" on body to show background.png for local testing. -->
  <body>
    <main class="broadcast-overlay" aria-label="Relay start list and results overlay">
      <header class="event-header">
        <div class="event-copy">
          <h1 id="meet-title"></h1>
          <p id="event-subtitle"></p>
        </div>

        <div class="speed-line" aria-hidden="true"></div>

        <img
          class="sso-logo"
          src="/views/startlist_and_results_relay/sso-logo.png"
          alt="Speed Skating Ontario"
        />
      </header>

      <section class="race-details" aria-live="polite" hidden>
        <span class="status-badge unofficial-indicator" hidden>Startlist</span>
        <div class="race-details-panel">
          <p class="race-details-text" id="race-details-bar"></p>
        </div>
      </section>

      <section class="results-section" aria-label="Teams" hidden>
        <div class="results-container" id="results-container"></div>
      </section>
    </main>

    <template id="result-template">
      <div class="result-row">
        <div class="position"></div>
        <div class="lane-color" aria-hidden="true"></div>
        <div class="racer-info">
          <div class="racer-name"></div>
          <div class="affiliation"></div>
        </div>
        <div class="final-time"></div>
      </div>
    </template>

    <script src="/views/shared/weblynx-helpers.js"></script>
    <script src="/views/shared/sso-event-display.js"></script>
    <script src="/views/shared/startlist-results-board.js"></script>
    <script>
      const UPDATE_INTERVAL = WebLynx.DEFAULT_UPDATE_INTERVAL_MS;

      const resultsBoard = WebLynx.createStartlistResultsBoard({
        demoResultsView: false,
        demoRacers: [
          { lane: 1, name: 'TEAM RED', affiliation: 'Club A', hasPlaceData: true, placeText: '1', finalTime: '00:01:25.3400000', cumulativeSplitTime: '00:01:25.3400000' },
          { lane: 2, name: 'TEAM BLUE', affiliation: 'Club B', hasPlaceData: true, placeText: '2', finalTime: '00:01:26.1200000', cumulativeSplitTime: '00:01:26.1200000' },
          { lane: 3, name: 'TEAM YELLOW', affiliation: 'Club A', hasPlaceData: true, placeText: '3', finalTime: '00:01:27.8900000', cumulativeSplitTime: '00:01:27.8900000' },
          { lane: 4, name: 'TEAM GREEN', affiliation: 'Club C', hasPlaceData: true, placeText: '4', finalTime: '00:01:28.4500000', cumulativeSplitTime: '00:01:28.4500000' }
        ],
        resolveLaneColor: function (config, racer) {
          return WebLynx.getLaneColorFromRacerName(config, racer.name);
        }
      });

      const raceTransition = WebLynx.createRaceIdentityTransition({
        fadeMs: 500,
        holdMs: 3000,
        getFadeElements: resultsBoard.getRaceBodyElements,
        onBlank: resultsBoard.clearRaceContent
      });

      function updateResultsData() {
        WebLynx.updateRaceData((data, error) => {
          if (error) {
            console.error('Error fetching race data:', error);
            return;
          }

          WebLynx.applyViewConfig(data);
          WebLynx.applyMeetIdentity(data);
          raceTransition.run(data, resultsBoard.paintResults);
        }, 'place');
      }

      WebLynx.startAutoUpdate(updateResultsData, UPDATE_INTERVAL, 'place', 'slowUpdateInterval');
    </script>
  </body>
</html>
