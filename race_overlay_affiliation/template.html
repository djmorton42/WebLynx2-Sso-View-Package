<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Race Overlay — Affiliation</title>
    <link rel="icon" type="image/png" href="/views/race_overlay_affiliation/sso-logo.png">
    <link rel="stylesheet" href="/views/race_overlay_affiliation/styles.css">
  </head>
  <body class="preview-background">
    <main class="broadcast-overlay" aria-label="Affiliation race overlay">
      <div class="sso-logo">
        <img src="/views/race_overlay_affiliation/sso-logo.png" alt="Speed Skating Ontario">
      </div>

      <div class="race-clock placard-panel" id="race-clock">00:00.0</div>

      <aside class="race-stack" aria-label="Race information">
        <div class="event-name placard-panel placard-panel--accent" id="event-name">
          Event Name
        </div>

        <div class="racer-stack" id="racer-stack"></div>
      </aside>
    </main>

    <template id="racer-template">
      <div class="racer-block placard-panel racer-block--affiliation">
        <div class="lane-color" aria-hidden="true"></div>
        <div class="racer-info">
          <div class="affiliation"></div>
        </div>
      </div>
    </template>

    <script src="/views/shared/weblynx-helpers.js"></script>
    <script>
      const UPDATE_INTERVAL = WebLynx.DEFAULT_UPDATE_INTERVAL_MS;
      const SORT_BY = 'lane';

      function createRacerBlock(racer, config) {
        const template = document.getElementById('racer-template');
        const clone = template.content.cloneNode(true);

        clone.querySelector('.lane-color').style.backgroundColor =
          WebLynx.getLaneColor(config, racer.lane);
        clone.querySelector('.affiliation').textContent = racer.affiliation || '-';

        return clone;
      }

      function updateRaceData() {
        WebLynx.updateRaceData((data, error) => {
          if (error) {
            console.error('Error fetching race data:', error);
            return;
          }

          const config = WebLynx.applyViewConfig(data);
          WebLynx.updateRaceClockDisplay(data);

          const eventName = data.event?.eventName || 'Event Name';
          const eventNumber = data.event?.eventNumber || '';
          const displayName = eventNumber ? `${eventNumber} - ${eventName}` : eventName;
          document.getElementById('event-name').textContent = displayName;

          const racerStack = document.getElementById('racer-stack');
          racerStack.innerHTML = '';

          const activeRacers = WebLynx.getActiveRacers(data.racers);
          const racerCount = activeRacers.length;

          racerStack.className = 'racer-stack';
          if (racerCount >= 2 && racerCount <= 10) {
            racerStack.classList.add(`racers-${racerCount}`);
          }

          activeRacers.forEach((racer) => {
            racerStack.appendChild(createRacerBlock(racer, config));
          });
        }, SORT_BY);
      }

      WebLynx.startAutoUpdate(updateRaceData, UPDATE_INTERVAL, SORT_BY);
    </script>
  </body>
</html>
